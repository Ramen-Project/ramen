[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ramen-topping-nn-builder"
version = "0.1.0"
description = "Neural Network Builder topping for Ramen - Visual PyTorch Module Construction"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Ramen Contributors", email = "noreply@ramen.dev" }
]
keywords = ["ramen", "topping", "neural-network", "pytorch", "visual-programming"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = []

[project.entry-points."ramen.toppings"]
nn_builder = "ramen_topping_nn_builder:get_topping"

[project.optional-dependencies]
torch = ["torch>=1.10.0"]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "isort",
    "flake8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ramen_topping_nn_builder"]