[project]
name = "ramen-topping-charts"
version = "1.0.0"
description = "Interactive chart components for Ramen"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Ramen Team", email = "team@ramen.dev" }
]
requires-python = ">=3.12"
dependencies = [
    "ramen>=0.1.0",
]

[project.entry-points."ramen.toppings"]
charts = "ramen_topping_charts:get_topping"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ramen_topping_charts"]