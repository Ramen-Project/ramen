[project]
name = "ramen"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license = "MIT"
authors = [
    { name = "ProgCat", email = "progcat@protonmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.7",
    "pydantic>=2.10.3",
    "rich>=13.9.4",
    "uv>=0.5.4",
    "nanoid>=2.0.0",
]

[project.optional-dependencies]
ui = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
]
full = [
    "ramen[ui]",
    "ramen-topping-torch",
    "ramen-topping-numpy",
    "ramen-topping-pandas",
    "ramen-topping-plots",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "httpx>=0.25.0",
    "fastapi>=0.104.0",
]
ml = [
    "ramen-topping-torch",
    "ramen-topping-numpy",
    "ramen-topping-pandas",
    "ramen-topping-plots"
]

[tool.uv]
default-groups = ["ml"]

[project.scripts]
ramen-cli = "ramen.entrypoint:main"

[project.entry-points.'ramen.toppings']
torch = "ramen_topping_torch"

[tool.uv.sources]
ramen-topping-torch = { workspace = true }
ramen-topping-numpy = { workspace = true }
ramen-topping-pandas = { workspace = true }
ramen-topping-plots = { workspace = true }

[tool.uv.workspace]
members = ["toppings/*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = ["node_modules", "dist", "src/web"]

[tool.hatch.build.targets.wheel]
packages = ["src/ramen"]

[tool.hatch.build.targets.wheel.force-include]
"src/ramen/statics" = "ramen/statics"

