[project]
name = "ramen"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license = "MIT"
authors = [
    { name = "ProgCat", email = "progcat@protonmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.7",
    "pydantic>=2.10.3",
    "rich>=13.9.4",
    "uv>=0.5.4",
    "nanoid>=2.0.0",
    "pygls>=1.3.1",
    "lsprotocol>=2023.0.1",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "httpx>=0.25.0",
    "fastapi>=0.104.0",
]
# ML toppings are now separate packages and optional
# Install with: uv add ramen-topping-torch ramen-topping-pandas etc.

[project.scripts]
ramen-cli = "ramen.entrypoint:main"

# Entry points and workspace members removed - toppings are now separate packages

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = ["node_modules", "dist", "vscode-extension"]

[tool.hatch.build.targets.wheel]
packages = ["src/ramen"]

